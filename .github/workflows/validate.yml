name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  structure:
    name: Structure, counts, traceability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate all plugins and the marketplace file
        run: node scripts/validate-all.mjs --no-cli
      - name: Generated catalogs are committed
        run: |
          node scripts/gen-catalog.mjs
          git add --intent-to-add --all   # so that a generated file nobody committed fails too
          git diff --exit-code
      - name: Per-agent builds (dist/) are up to date
        run: |
          node scripts/build-targets.mjs
          git add --intent-to-add --all
          git diff --exit-code
      - name: MCP server protocol self-test
        run: node scripts/mcp-selftest.mjs
      - name: Review plumbing self-test (findings, CI runner, hook, PR poster, Action steps)
        run: node scripts/selftest-ci.mjs
      - name: Codex role files and Gemini command and policy files parse as TOML
        run: |
          python3 - <<'PY'
          import glob, tomllib
          roles = sorted(glob.glob('dist/codex/*/skills/install-roles/roles/*.toml'))
          assert len(roles) == 300, f'{len(roles)} role files'
          for f in roles:
              d = tomllib.load(open(f, 'rb'))
              assert set(d) == {'name', 'description', 'developer_instructions'}, f
          commands = sorted(glob.glob('dist/gemini/*/commands/*/*.toml'))
          assert commands, 'no Gemini commands'
          for f in commands:
              d = tomllib.load(open(f, 'rb'))
              assert set(d) == {'description', 'prompt'}, f
          policies = sorted(glob.glob('dist/gemini/*/policies/*.toml'))
          assert len(policies) == 14, f'{len(policies)} policy files'
          for f in policies:
              rules = tomllib.load(open(f, 'rb'))['rule']
              assert rules and all(r['decision'] == 'deny' and r.get('subagent') for r in rules), f
          print(f'{len(roles)} Codex roles, {len(commands)} Gemini commands, {len(policies)} policy files parse')
          PY

  official:
    name: Official `claude plugin validate`
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code CLI
        run: npm install --global @anthropic-ai/claude-code
      - name: Validate marketplace and plugins
        run: |
          claude plugin validate .
          for d in plugins/*/; do claude plugin validate "$d"; done
