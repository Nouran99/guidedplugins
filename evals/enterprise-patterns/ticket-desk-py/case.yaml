schema_version: "1.1"
name: ticket-desk-py
description: "A support-desk module where the repository and the audit log each commit on their own around a chat webhook call, an edit form overwrites concurrent changes, a lazy assignee costs a query per ticket, the handler decides the reopen rule and that rule is only tested through HTTP."
tags: [detect]
execution:
  max_turns: 14
  timeout_seconds: 360
  allowed_tools: [Read, Glob, Grep, Skill]
context:
  scaffold_script: scaffold.sh
