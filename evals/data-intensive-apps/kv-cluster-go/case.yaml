schema_version: "1.1"
name: kv-cluster-go
description: "A client for a sharded key-value cluster that routes with hash modulo the node count, claims quorum overlap always returns the latest write, resolves conflicts with the client clock, checks a lease without a fencing token, moves money with two separate puts and scans every node for the most visited page."
tags: [detect]
execution:
  max_turns: 14
  timeout_seconds: 360
  allowed_tools: [Read, Glob, Grep, Skill]
context:
  scaffold_script: scaffold.sh
