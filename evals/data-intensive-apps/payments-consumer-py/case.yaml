schema_version: "1.1"
name: payments-consumer-py
description: "A payment-event consumer that adds to a revenue counter on every delivery, retries a refund with a fresh key per attempt and records the timeouts as failed, publishes after the commit and swallows the error, orders status changes by the emitters' clocks, buckets revenue by processing day and has tests that deliver each message once."
tags: [detect]
execution:
  max_turns: 14
  timeout_seconds: 360
  allowed_tools: [Read, Glob, Grep, Skill]
context:
  scaffold_script: scaffold.sh
