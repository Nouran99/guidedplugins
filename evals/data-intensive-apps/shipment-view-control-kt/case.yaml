schema_version: "1.1"
name: shipment-view-control-kt
description: "A shipment read model that follows the book: a version-guarded upsert that makes duplicates and late events harmless, the notification queued in the same transaction, unknown values mapped and counted, a documented rebuild by replay, a lag metric and tests for duplicate, late and replayed events. A review should find nothing to restructure."
tags: [control]
execution:
  max_turns: 14
  timeout_seconds: 360
  allowed_tools: [Read, Glob, Grep, Skill]
context:
  scaffold_script: scaffold.sh
