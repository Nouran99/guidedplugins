schema_version: "1.1"
name: architecture-control-ts
description: "A permit extension feature that follows the dependency rule: a guarded entity with a documented limit, a use case that owns its store port and response model, a thin controller with one outcome table, a store adapter, a composition root, tests for each layer with fakes and a test that checks the import direction. A review should find nothing to restructure."
tags: [control]
execution:
  max_turns: 14
  timeout_seconds: 360
  allowed_tools: [Read, Glob, Grep, Skill]
context:
  scaffold_script: scaffold.sh
