schema_version: "1.1"
name: orders-release-sh
description: "A release script that migrates then replaces all hosts at once with no stop on failure, no resume or per-host check and an in-place overwrite of the live directory, plus a column rename and a whole-table rewrite in one migration and a hard-coded database password printed to the log."
tags: [detect]
execution:
  max_turns: 14
  timeout_seconds: 360
  allowed_tools: [Read, Glob, Grep, Skill]
context:
  scaffold_script: scaffold.sh
