schema_version: "1.1"
name: rates-quote-py
description: "A quote service and its rates client: a call with no time limit, an indiscriminate fixed-delay retry loop, retries stacked in two layers, a silent made-up fallback rate, an unvalidated reply that is cached and no fast-fail when the dependency is down."
tags: [detect]
execution:
  max_turns: 14
  timeout_seconds: 360
  allowed_tools: [Read, Glob, Grep, Skill]
context:
  scaffold_script: scaffold.sh
