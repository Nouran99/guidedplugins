schema_version: "1.1"
name: inventory-control-ts
description: "A stock lookup that follows the production-survival rules: named and sourced time limits, one jittered and bounded retry owner, a breaker that does not count refused requests and logs its transitions, a flagged degraded result, a validated reply, structured failure logs, latency and breaker metrics, and tests with a stalled peer. A review should find nothing to restructure."
tags: [control]
execution:
  max_turns: 14
  timeout_seconds: 360
  allowed_tools: [Read, Glob, Grep, Skill]
context:
  scaffold_script: scaffold.sh
