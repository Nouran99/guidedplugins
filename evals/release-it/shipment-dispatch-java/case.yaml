schema_version: "1.1"
name: shipment-dispatch-java
description: "A shipment dispatcher on one fixed-size executor that runs the booking batch, mail and warehouse hooks, with an unbounded work queue, a database connection held across carrier calls, every pending row loaded at once, an endless blind resubmit and a bare stack trace."
