schema_version: "1.1"
name: orders-service-go
description: "An orders service whose startup silently defaults critical settings and runs the schema migration on every instance, whose health endpoint is always green, whose hourly export starts on the hour, runs every tenant at once and swallows its errors, and whose purge endpoint has no guardrails."
tags: [detect]
execution:
  max_turns: 14
  timeout_seconds: 360
  allowed_tools: [Read, Glob, Grep, Skill]
context:
  scaffold_script: scaffold.sh
