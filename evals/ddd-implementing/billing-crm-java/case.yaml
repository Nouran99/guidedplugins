schema_version: "1.1"
name: billing-crm-java
description: "A layer-by-layer billing app where one Customer class built from the CRM's row type serves billing and support, the repository joins the CRM tables, the invoice entity is serialized straight onto the broker and the service is called InvoiceManager.process."
tags: [detect]
execution:
  max_turns: 14
  timeout_seconds: 360
  allowed_tools: [Read, Glob, Grep, Skill]
context:
  scaffold_script: scaffold.sh
