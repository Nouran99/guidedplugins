schema_version: "1.1"
name: late-fees-py
description: "A nightly late-fee job whose constructor opens a database connection, with the clock and a global settings object read inside the rule, an exit in the middle of the logic, one body that mixes fee arithmetic with queries and a CSV file, decisions recorded only in a log line and no tests."
tags: [detect]
execution:
  max_turns: 14
  timeout_seconds: 360
  allowed_tools: [Read, Glob, Grep, Skill]
context:
  scaffold_script: scaffold.sh
