schema_version: "1.1"
name: receipt-mailer-java
description: "A receipt mailer whose constructor connects to a mail server, that builds its PDF writer inside the method, reaches a singleton repository and static config, takes a servlet request, writes the archive file directly, reads the date and is tested through reflection on private fields."
tags: [detect]
execution:
  max_turns: 14
  timeout_seconds: 360
  allowed_tools: [Read, Glob, Grep, Skill]
context:
  scaffold_script: scaffold.sh
