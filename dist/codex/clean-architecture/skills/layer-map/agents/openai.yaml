interface:
  display_name: "Layer Map"
  short_description: "Discover the layers a repository really has and the direction of the imports between them, in a forked context. Returns a ranked layer table, an import matrix and the outward edges, in at most 40 lines."
  default_prompt: "Use $clean-architecture:layer-map on directory | empty for the repository root."
policy:
  allow_implicit_invocation: false
