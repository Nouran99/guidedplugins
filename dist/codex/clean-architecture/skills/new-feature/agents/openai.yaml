interface:
  display_name: "New Feature"
  short_description: "Build a new feature in the order Clean Architecture gives: domain rule, use case, boundary interfaces, presenter and gateway contracts, adapters, wiring. Skips layers the feature does not need. Runs the tests, never commits."
  default_prompt: "Use $clean-architecture:new-feature."
policy:
  allow_implicit_invocation: false
