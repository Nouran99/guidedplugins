interface:
  display_name: "Knowledge Map"
  short_description: "Inventory the system facts in a directory or repository in a forked context: every place each business rule, validation, mapping, calculation or config meaning is represented, whether the copies agree, and a proposed owner, in at most 40 lines."
  default_prompt: "Use $pragmatic-programmer:knowledge-map on directory | glob | named fact such as 'order cancellation' | empty for the repository root."
policy:
  allow_implicit_invocation: false
