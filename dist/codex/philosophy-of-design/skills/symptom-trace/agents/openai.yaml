interface:
  display_name: "Symptom Trace"
  short_description: "Trace a complaint such as 'this change touched too many files' or 'I cannot follow this' from the symptom to its likely cause with history evidence, and name the skill that treats it."
  default_prompt: "Use $philosophy-of-design:symptom-trace."
policy:
  allow_implicit_invocation: false
