interface:
  display_name: "Depth Map"
  short_description: "Inventory the modules in a scope by interface weight and hidden work in a forked context, and return the shallow and pass-through ones ranked, in at most 40 lines."
  default_prompt: "Use $philosophy-of-design:depth-map on directory | glob | empty for the repository root."
policy:
  allow_implicit_invocation: false
