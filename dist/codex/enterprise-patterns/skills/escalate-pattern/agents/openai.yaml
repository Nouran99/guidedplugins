interface:
  display_name: "Escalate Pattern"
  short_description: "When a Transaction Script has outgrown itself (duplicated decisions, lifecycle or invariant complexity), confirm the trigger, move the most repeated decision into a model object in small tested steps, and name the persistence follow-up."
  default_prompt: "Use $enterprise-patterns:escalate-pattern on file | function | file:line | empty to ask."
policy:
  allow_implicit_invocation: false
