interface:
  display_name: "Audit"
  short_description: "Scan a directory or repository in a forked context for refactoring readiness: where change is expensive, whether the area has a safety net, and which smells cost most. Ranked hot spots in at most 40 lines."
  default_prompt: "Use $refactoring:audit on directory | glob | empty for the repository root."
policy:
  allow_implicit_invocation: false
