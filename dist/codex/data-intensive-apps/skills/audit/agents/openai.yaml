interface:
  display_name: "Audit"
  short_description: "Scan a directory or repository for data-contract health in a forked context and return concerns rated healthy, watch or hot, with ranked hot spots, in at most 40 lines."
  default_prompt: "Use $data-intensive-apps:audit on directory | glob | empty for the repository root."
policy:
  allow_implicit_invocation: false
