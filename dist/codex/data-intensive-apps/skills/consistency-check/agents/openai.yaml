interface:
  display_name: "Consistency Check"
  short_description: "Map every read path in a scope to its freshness need, where it is served from and the guarantee it gets, plus the conflict model for concurrent writes, in a forked context and at most 40 lines."
  default_prompt: "Use $data-intensive-apps:consistency-check on feature | directory | entity name | empty for the repository root."
policy:
  allow_implicit_invocation: false
