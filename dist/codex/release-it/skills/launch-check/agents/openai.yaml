interface:
  display_name: "Launch Check"
  short_description: "Go or no-go for putting a service into production, in a forked context: look for evidence of rollback, startup validation, health, limits, signals, security and rehearsal, and return a verdict with the missing items in at most 40 lines."
  default_prompt: "Use $release-it:launch-check on service directory | empty for the repository root."
policy:
  allow_implicit_invocation: false
