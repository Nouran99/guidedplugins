interface:
  display_name: "Fix"
  short_description: "Resolve given Release It! findings with the smallest change per finding, run the tests after each, and report. Flags every number chosen without a source. Never commits."
  default_prompt: "Use $release-it:fix on finding text | file:line | 'last review' | empty to ask."
policy:
  allow_implicit_invocation: false
