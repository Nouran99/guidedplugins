interface:
  display_name: "Explain Rule"
  short_description: "Explain one Release It! rule: its strength (must, should, must not), the failure it prevents, how to check it, an original example and the exceptions the source gives."
  default_prompt: "Use $release-it:explain-rule on rule name | section | situation you are unsure about."
policy:
  allow_implicit_invocation: false
