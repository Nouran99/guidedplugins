interface:
  display_name: "Audit"
  short_description: "Scan a directory or repository for production-survival hot spots in a forked context, rate each failure domain, and return the top five with their owning skills in at most 40 lines."
  default_prompt: "Use $release-it:audit on directory | glob | empty for the repository root."
policy:
  allow_implicit_invocation: false
