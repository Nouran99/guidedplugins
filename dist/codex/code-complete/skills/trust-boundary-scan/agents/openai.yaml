interface:
  display_name: "Trust Boundary Scan"
  short_description: "Inventory the places where external input enters a directory or repository, in a forked context, and rate how each one validates, rejects, recovers, asserts and stays diagnosable. At most 40 lines."
  default_prompt: "Use $code-complete:trust-boundary-scan on directory | glob | empty for the repository root."
policy:
  allow_implicit_invocation: false
