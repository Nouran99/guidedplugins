interface:
  display_name: "Plan"
  short_description: "Plan a non-trivial change before editing: restate the requirement, settle the construction decisions, list risks, cut verifiable increments and choose the test cases. Does not edit."
  default_prompt: "Use $code-complete:plan on task description | issue text | empty to plan around the current diff."
policy:
  allow_implicit_invocation: false
