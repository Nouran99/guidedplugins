interface:
  display_name: "Glossary"
  short_description: "Build a per-context table of domain terms from a codebase in a forked context, and report synonyms, homonyms and placeholder names with the files that show them. At most 40 lines."
  default_prompt: "Use $ddd-distilled:glossary on directory | glob | context name | empty for the repository root."
policy:
  allow_implicit_invocation: false
