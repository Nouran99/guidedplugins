interface:
  display_name: "Classify Subdomains"
  short_description: "Inventory the business capabilities of a codebase in a forked context, propose core, supporting or generic classes with evidence, flag mismatches between class and modeling effort, and list the questions the user must answer. At most 40 lines."
  default_prompt: "Use $ddd-distilled:classify-subdomains on directory | product or area description | empty for the repository root."
policy:
  allow_implicit_invocation: false
