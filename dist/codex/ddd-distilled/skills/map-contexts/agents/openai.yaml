interface:
  display_name: "Map Contexts"
  short_description: "Reconstruct the as-found context map of a codebase: contexts, integration edges, the relationship each edge shows in practice versus what it is called, and dishonest claims. Whole tree, not a diff: to judge a change use ddd-distilled-relationship-reviewer or ddd-distilled-context-boundary-reviewer. At most 40 lines."
  default_prompt: "Use $ddd-distilled:map-contexts."
policy:
  allow_implicit_invocation: false
