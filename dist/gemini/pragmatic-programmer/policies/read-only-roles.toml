subagent = "pragmatic-programmer-slice-reviewer"
decision = "deny"
priority = 900
denyMessage = "pragmatic-programmer-slice-reviewer is a read-only role."

[[rule]]
toolName = "run_shell_command"
subagent = "pragmatic-programmer-slice-reviewer"
commandRegex = "(?!(?:git (?:diff|log|show|status|blame|ls-files)|ls|grep|rg|wc|head|tail|find)[ \"]|git branch --show-current\")"
decision = "deny"
priority = 900
denyMessage = "pragmatic-programmer-slice-reviewer is a read-only role. Allowed shell commands: git diff|log|show|status|blame|ls-files, git branch --show-current, ls, grep, rg, wc, head, tail, find. Redirection, pipes, command chaining, command substitution and flags that write or run a program are refused, and the check reads the command text, so a | < > ; or & inside a quoted pattern is refused too (use grep -e a -e b, or the grep_search tool)."

[[rule]]
toolName = "run_shell_command"
subagent = "pragmatic-programmer-slice-reviewer"
commandRegex = "([^\"\\\\]|\\\\.)*([<>|;&`]|\\$\\(|\\\\n|\\\\r|--output|--ext-diff|--textconv|--pre[^a-z]|--hostname-bin|--search-zip|-exec|-delete|-fprint|-fls|-ok|--[a-zA-Z-]*(\\\\\"|'|\\\\\\\\|\\$|\\{))"
decision = "deny"
priority = 900
denyMessage = "pragmatic-programmer-slice-reviewer is a read-only role. Allowed shell commands: git diff|log|show|status|blame|ls-files, git branch --show-current, ls, grep, rg, wc, head, tail, find. Redirection, pipes, command chaining, command substitution and flags that write or run a program are refused, and the check reads the command text, so a | < > ; or & inside a quoted pattern is refused too (use grep -e a -e b, or the grep_search tool)."

