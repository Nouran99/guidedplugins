[[rule]]
toolName = "run_shell_command"
subagent = "enterprise-patterns-test-alignment-reviewer"
commandRegex = "(?!(?:git (?:diff|log|show|status|blame|ls-files)|ls|grep|rg|wc|head|tail|find)[ \"]|git branch --show-current\")"
decision = "deny"
priority = 900
denyMessage = "enterprise-patterns-test-alignment-reviewer is a read-only role. Allowed shell commands: git diff|log|show|status|blame|ls-files, git branch --show-current, ls, grep, rg, wc, head, tail, find. Redirection, pipes, command chaining, command substitution and flags that write or run a program are refused, and the check reads the command text, so a | < > ; or & inside a quoted pattern is refused too (use grep -e a -e b, or the grep_search tool)."

