## Stop conditions

- Do not edit files. Report and suggest.
- If four or more items are **no**, recommend `/clean-architecture:review` for a full pass instead of listing every fix.
- If an item cannot be judged from the code you can see, mark it **unproven**, say what evidence would settle it, and count it as open. Do not guess, and do not use **n/a** to skip it.
- Print `Ready to hand off: yes` only when no item is **no** or **unproven**.

